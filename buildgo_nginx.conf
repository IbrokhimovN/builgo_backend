# Template NGINX reverse-proxy configuration for BuildGo 

upstream app_server {
    server 127.0.0.1:8000;
    
    # Maintain a pool of 64 persistent connections to the app server
    keepalive 64; 
}

server {
    listen 80;
    server_name buildgo.uz;

    # GZIP Compression to reduce API payload sizes by 70%+
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
    
    # Limit max upload size (images)
    client_max_body_size 5M;

    location /api/ {
        proxy_pass http://app_server;
        
        # Enable Keepalive to Upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Forward proper headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static directly via NGINX for speed
    location /static/ {
        alias /path/to/buildGo/builgo_backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve media (if not using S3/CDNs yet)
    location /media/ {
        alias /path/to/buildGo/builgo_backend/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
